name: REA plugin validation

on:
  pull_request:
    paths:
      - "plugins/rea-agent-plugin/**"
      - ".github/workflows/rea-plugin-validation.yml"
  push:
    paths:
      - "plugins/rea-agent-plugin/**"
      - ".github/workflows/rea-plugin-validation.yml"

permissions:
  contents: read

jobs:
  validate-plugin-package:
    name: Validate plugin manifests and package layout
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate REA plugin
        run: node plugins/rea-agent-plugin/scripts/validate-plugin.mjs
